[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "measure-shift"
version = "0.1.0"
description = "Live camera alignment with phase correlation and optional image analytics"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "PySide6>=6.7,<7",
  "pyqtgraph>=0.13.7,<0.15",
]

[project.optional-dependencies]
cameras = ["pypylon>=4", "pyueye>=4.96"]
motion = ["tinkerforge>=2.1.32,<3"]
dev = ["pytest>=8"]

[project.scripts]
measure-shift = "measure_shift.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
